name: SmartGuard Android source check

on:
  workflow_dispatch:
  push:
    branches: [main, 'feature/smartguard-family-android-v060']
    paths:
      - 'android/**'
      - 'public/smartguard-family/**'
      - 'src/pages/familia/**'
      - 'src/family/**'
      - 'src/mobile/protection-panel.tsx'
      - 'src/components/layout/site-header.tsx'
      - 'src/mobile/**'
      - 'src/lib/link-analysis/**'
      - 'src/App.tsx'
      - 'src/pages/home/index.tsx'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/smartguard-android.yml'

jobs:
  android-debug:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_THREAT_CHECK_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-34' 'build-tools;34.0.0' 'platform-tools'
      - name: Install deps and test
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm exec tsc -p tsconfig.app.json --noEmit
          pnpm build:prod
      - name: Build APK from mobile source
        run: |
          pnpm android:bundle
          cd android
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon
      - name: Upload internal APK (not a release)
        uses: actions/upload-artifact@v4
        with:
          name: smartguard-family-v060-untrusted-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Produce complete source ZIP without signing credentials
        run: git archive --format=zip --output=SmartGuard-Family-v0.6.0-source.zip HEAD
      - name: Upload complete source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: smartguard-family-v060-source
          path: SmartGuard-Family-v0.6.0-source.zip
          if-no-files-found: error
