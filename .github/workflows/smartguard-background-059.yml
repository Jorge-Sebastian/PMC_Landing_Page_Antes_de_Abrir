name: SmartGuard Firebase native background 0.5.9
on:
  workflow_dispatch:
  push:
    branches:
      - feature/smartguard-firebase-background-059
    paths:
      - 'android/app/src/main/java/co/antesdeabrir/piloto/**'
      - '.github/workflows/smartguard-background-059.yml'
  pull_request:
    paths:
      - 'android/app/src/main/java/co/antesdeabrir/piloto/**'
      - '.github/workflows/smartguard-background-059.yml'
permissions:
  contents: read
jobs:
  compile-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-34' 'build-tools;34.0.0' 'platform-tools'
      - name: Build and test sources
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm exec tsc -p tsconfig.app.json --noEmit
          pnpm android:bundle
          chmod +x android/gradlew
          (cd android && ./gradlew :app:assembleDebug --no-daemon)
      - name: Confirm native background components
        run: |
          unzip -p android/app/build/outputs/apk/debug/app-debug.apk classes.dex | strings | grep -q 'FirebaseBackgroundTelemetry'
          unzip -p android/app/build/outputs/apk/debug/app-debug.apk classes.dex | strings | grep -q 'firebaseBackgroundSession'
      - name: Upload DEBUG donor only (do not install)
        uses: actions/upload-artifact@v4
        with:
          name: smartguard-native-background-dex-059
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
