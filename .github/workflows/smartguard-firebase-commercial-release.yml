name: SmartGuard Firebase commercial deploy (manual, backup first)

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: Exact Firebase project ID, no staging aliases
        required: true
        default: smartguard-piloto-20261029
        type: string
      backup_bucket:
        description: Existing GCS backup bucket name (operator must have export permission)
        required: true
        type: string
      approval:
        description: Type DEPLOY_SMARTGUARD_FIREBASE to deploy after tests and backup
        required: true
        type: string

permissions:
  contents: read

jobs:
  firebase-release:
    runs-on: ubuntu-latest
    environment: smartguard-production
    env:
      FIREBASE_PROJECT: ${{ inputs.project_id }}
      BACKUP_BUCKET: ${{ inputs.backup_bucket }}
      FIREBASE_SERVICE_ACCOUNT_SMARTGUARD_B64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SMARTGUARD_B64 }}
    steps:
      - name: Validate exact project and authorization
        shell: bash
        env:
          APPROVAL: ${{ inputs.approval }}
        run: |
          set -euo pipefail
          test "$FIREBASE_PROJECT" = "smartguard-piloto-20261029"
          test "$APPROVAL" = "DEPLOY_SMARTGUARD_FIREBASE"
          [[ "$BACKUP_BUCKET" =~ ^[a-z0-9][a-z0-9._-]{2,62}$ ]]
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_SMARTGUARD_B64" ]; then
            echo "::error::Missing Firebase service-account secret in protected environment"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify pinned server dependencies and business invariants
        run: |
          set -euo pipefail
          npm ci --prefix functions --ignore-scripts --no-audit
          node --check functions/index.js
          node --test functions/test/*.node.cjs
          pnpm install --frozen-lockfile
          pnpm test
          pnpm exec tsc -p tsconfig.app.json --noEmit
          pnpm build:prod
      - name: Re-run Firestore security tests before production mutation
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix firebase --no-save --no-package-lock \
            firebase-tools@15.4.0 @firebase/rules-unit-testing@5.0.0 firebase@12.6.0
          cd firebase
          ./node_modules/.bin/firebase --config ../firebase.json emulators:exec \
            --project demo-smartguard-family --only firestore 'node tests/security-check.cjs'
      - uses: google-github-actions/setup-gcloud@v2
        with:
          version: '>= 480.0.0'
      - name: Validate and load short-lived isolated CI service account file
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_SMARTGUARD_B64" | base64 -d > "$RUNNER_TEMP/firebase-ci.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-ci.json" \
            FIREBASE_PROJECT="$FIREBASE_PROJECT" node -e "
              const fs=require('fs'), data=JSON.parse(fs.readFileSync(process.env.GOOGLE_APPLICATION_CREDENTIALS));
              if (data.type!=='service_account' || data.project_id!==process.env.FIREBASE_PROJECT) process.exit(1);
            "
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-ci.json" >> "$GITHUB_ENV"
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/firebase-ci.json" --quiet >/dev/null
          gcloud config set project "$FIREBASE_PROJECT" --quiet >/dev/null
      - name: Create and confirm Firestore managed export before deployment
        shell: bash
        run: |
          set -euo pipefail
          EXPORT_PATH="gs://$BACKUP_BUCKET/smartguard-before-commercial/$GITHUB_RUN_ID"
          gcloud firestore export "$EXPORT_PATH" \
            --database='(default)' --project="$FIREBASE_PROJECT" --quiet
          echo "Backup operation finished at $EXPORT_PATH"
      - name: Deploy isolated callable codebase and then reviewed Firestore rules
        shell: bash
        run: |
          set -euo pipefail
          ./firebase/node_modules/.bin/firebase deploy \
            --only functions:smartguard-commercial --project "$FIREBASE_PROJECT" --non-interactive
          ./firebase/node_modules/.bin/firebase deploy \
            --only firestore:rules --project "$FIREBASE_PROJECT" --non-interactive
          echo "Functions and Firestore rules deployed. Commercial enforcement flag is NOT changed."
          echo "Do not enable Android commercial production until authenticated E2E checks succeed."
      - name: Remove service-account material on all exits
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/firebase-ci.json"
