name: SmartGuard Firebase commercial production (manual)
on:
  workflow_dispatch:
    inputs:
      project_confirmation:
        description: Type smartguard-piloto-20261029 to authorize this exact Firebase project
        type: string
        required: true
      deployment_confirmation:
        description: Type DEPLOY_FIREBASE_COMMERCIAL after checking tests and backup
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: smartguard-firebase-commercial-production
  cancel-in-progress: false
jobs:
  firebase-commercial:
    runs-on: ubuntu-latest
    environment: smartguard-production
    env:
      FIREBASE_PROJECT_ID: smartguard-piloto-20261029
      FIREBASE_DEPLOY_SERVICE_ACCOUNT_B64: ${{ secrets.FIREBASE_DEPLOY_SERVICE_ACCOUNT_B64 }}
    steps:
      - name: Verify explicit authorization and exact branch
        shell: bash
        env:
          PROJECT_CONFIRMATION: ${{ inputs.project_confirmation }}
          DEPLOYMENT_CONFIRMATION: ${{ inputs.deployment_confirmation }}
        run: |
          set -euo pipefail
          test "$PROJECT_CONFIRMATION" = "$FIREBASE_PROJECT_ID"
          test "$DEPLOYMENT_CONFIRMATION" = "DEPLOY_FIREBASE_COMMERCIAL"
          test "$GITHUB_REF" = "refs/heads/feature/smartguard-production-core-20261117"
          test -n "$FIREBASE_DEPLOY_SERVICE_ACCOUNT_B64"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Reproduce Firebase dependencies and run core unit tests
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix functions --ignore-scripts --no-audit --no-fund
          npm ci --prefix firebase --ignore-scripts --no-audit --no-fund
          node --check functions/index.js
          node --check functions/lib/commercial.js
          node --test functions/test/*.node.cjs
      - name: Run Firestore emulator isolation and family rules
        shell: bash
        run: |
          set -euo pipefail
          cd firebase
          ./node_modules/.bin/firebase --config ../firebase.json emulators:exec \
            --project demo-smartguard-family --only firestore 'node tests/security-check.cjs'
      - name: Materialize verified service account in restricted runner file
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$FIREBASE_DEPLOY_SERVICE_ACCOUNT_B64" | base64 -d > "$RUNNER_TEMP/firebase-service-account.json"
          node -e "
            const a=require(process.argv[1]);
            if(a.project_id!==process.env.FIREBASE_PROJECT_ID) throw Error('Firebase service account project mismatch');
            if(!a.client_email || !a.private_key) throw Error('Service account incomplete');
            console.log('Firebase project ID verified; credentials suppressed.');
          " "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"
      - name: Deploy the isolated commercial Cloud Functions codebase
        shell: bash
        run: |
          set -euo pipefail
          ./firebase/node_modules/.bin/firebase deploy \
            --only functions:smartguard-commercial --project "$FIREBASE_PROJECT_ID" --non-interactive
      - name: Deploy tested Firestore rules without changing Firebase Hosting
        shell: bash
        run: |
          set -euo pipefail
          ./firebase/node_modules/.bin/firebase deploy \
            --only firestore:rules --project "$FIREBASE_PROJECT_ID" --non-interactive
          echo "::notice::Commercial enforcement remains OFF until migration and real E2E verification."
      - name: Always clear credential file
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/firebase-service-account.json"
