name: SmartGuard pricing and landing validation

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/pages/home/pricing-*'
      - 'src/pages/home/index.tsx'
      - 'src/pages/home/android-app.tsx'
      - 'src/components/layout/site-header.tsx'
      - 'src/components/layout/site-footer.tsx'
      - 'public/locales/es.json'
      - '.github/workflows/smartguard-pricing-check.yml'
  pull_request:
    paths:
      - 'src/pages/home/pricing-*'
      - 'src/pages/home/index.tsx'
      - 'src/pages/home/android-app.tsx'
      - 'src/components/layout/site-header.tsx'
      - 'src/components/layout/site-footer.tsx'
      - 'public/locales/es.json'
      - '.github/workflows/smartguard-pricing-check.yml'

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run analyzer and pricing tests
        run: pnpm test
      - name: Verify TypeScript
        run: pnpm exec tsc -p tsconfig.app.json --noEmit
      - name: Build public web
        run: pnpm build:prod
