name: SmartGuard quality reports (no Firebase credentials)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/quality/**'
      - 'tests/quality/**'
      - 'docs/calidad-tecnica/**'
      - '.github/workflows/smartguard-quality-reports.yml'
permissions:
  contents: read
jobs:
  quality-calculations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install report dependency
        run: python -m pip install 'openpyxl>=3.1,<4'
      - name: Unit tests
        run: python -m unittest discover -s tests/quality -v
      - name: Validate demo JSON provenance
        run: |
          python - <<'PY'
          import json
          x=json.load(open('public/smartguard-quality/demo-summary.json'))
          assert x['provenance']=='SIMULADO_NO_EVIDENCIA'
          assert len(x['devices'])==6
          assert all(d['id'].startswith('SG-SIM-') for d in x['devices'])
          print('Demo provenance protected')
          PY
