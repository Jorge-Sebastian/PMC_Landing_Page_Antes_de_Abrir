apply plugin: 'com.android.application'

android {
    namespace "co.antesdeabrir.piloto"
    compileSdk rootProject.ext.compileSdkVersion
    buildFeatures { buildConfig true }
    defaultConfig {
        // The feature preview is fail-closed in native background listeners until
        // the app synchronizes a live server entitlement. Legacy pilot stays open.
        buildConfigField "boolean", "SMARTGUARD_COMMERCIAL_ENFORCED",
            ((System.getenv("VITE_SMARTGUARD_COMMERCIAL_ENABLED") ?: "false") == "true").toString()
        applicationId "co.antesdeabrir.piloto"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 28
        versionName "0.6.12-pilot"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // The pilot signing key is NOT versioned. If the original test key is
    // present locally, preserve update compatibility; otherwise use Android's
    // automatically generated debug signing key for clean CI builds.
    signingConfigs {
        if (rootProject.file('signing/smartguard-pilot.keystore').exists()) {
            debug {
                storeFile rootProject.file('signing/smartguard-pilot.keystore')
                storePassword 'android'
                keyAlias 'smartguard-pilot'
                keyPassword 'android'
            }
        }
        // Production release signing is NEVER read from the repository.
        // CI injects a temporary encrypted keystore and secrets at build time.
        if (System.getenv('SG_RELEASE_KEYSTORE') &&
            file(System.getenv('SG_RELEASE_KEYSTORE')).exists() &&
            System.getenv('SG_RELEASE_STORE_PASSWORD') &&
            System.getenv('SG_RELEASE_KEY_ALIAS') &&
            System.getenv('SG_RELEASE_KEY_PASSWORD')) {
            release {
                storeFile file(System.getenv('SG_RELEASE_KEYSTORE'))
                storePassword System.getenv('SG_RELEASE_STORE_PASSWORD')
                keyAlias System.getenv('SG_RELEASE_KEY_ALIAS')
                keyPassword System.getenv('SG_RELEASE_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (signingConfigs.findByName('release') != null)
                signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // Firebase Performance SDK: remote traces require Android Firebase app registration.
    implementation platform('com.google.firebase:firebase-bom:34.19.0')
    implementation 'com.google.firebase:firebase-perf'
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
